<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>ChatroKontho Card Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&family=Roboto:wght@900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 30px; }
        .editor { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); width: 100%; max-width: 550px; margin-bottom: 30px; }
        .row { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #444; font-size: 14px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        
        .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        button { padding: 15px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; color: white; }
        
        .btn-gen { background: #1a73e8; }
        .btn-gen:hover { background: #1557b0; }
        
        .btn-down { background: #28a745; }
        .btn-down:hover { background: #218838; }
        
        canvas { border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); max-width: 100%; height: auto; background: #fff; }
        .footer-text { margin-top: 15px; font-size: 12px; color: #888; }
    </style>
</head>
<body>

    <div class="editor">
        <h2 style="margin-top:0; color: #333; text-align: center;">ছাত্র কন্ঠ কার্ড জেনারেটর</h2>
        
        <div class="row">
            <label>১. খবরের ছবি (Upload News Image)</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <div class="row">
            <label>২. শিরোনাম (Headline)</label>
            <input type="text" id="title" placeholder="এখানে হেডলাইন লিখুন...">
        </div>

        <div class="row">
            <label>৩. তারিখ (Date)</label>
            <input type="text" id="date">
        </div>

        <div class="button-group">
            <button class="btn-gen" onclick="drawCanvas()">Update Preview</button>
            <button class="btn-down" onclick="downloadCard()">Download PNG</button>
        </div>
    </div>

    <canvas id="newsCanvas" width="1080" height="1080"></canvas>
    <p class="footer-text">Powered by ChatroKontho Engine</p>

    <script>
        // Set default date to today in Bengali
        const today = new Date();
        const formattedDate = today.toLocaleDateString('bn-BD', { year: 'numeric', month: 'long', day: 'numeric' });
        document.getElementById('date').value = formattedDate;
        
        const logoImg = new Image();
        logoImg.src = '/static/logo.png'; 

        function drawCanvas() {
            const canvas = document.getElementById('newsCanvas');
            const ctx = canvas.getContext('2d');
            const titleText = document.getElementById('title').value || "আপনার শিরোনাম এখানে লিখুন";
            const dateText = document.getElementById('date').value;
            const imageInput = document.getElementById('imageInput');

            // 1. Background (Creamy White)
            ctx.fillStyle = "#F6F2E9"; 
            ctx.fillRect(0, 0, 1080, 1080);

            const finalizeDrawing = (mainImg) => {
                // 2. Draw News Image
                if (mainImg) {
                    const imgAspect = mainImg.width / mainImg.height;
                    const targetAspect = 1080 / 540;
                    let dw, dh, dx = 0, dy = 0;

                    if (imgAspect > targetAspect) {
                        dh = 540; dw = 540 * imgAspect;
                        dx = -(dw - 1080) / 2;
                    } else {
                        dw = 1080; dh = 1080 / imgAspect;
                        dy = -(dh - 540) / 2;
                    }
                    ctx.save();
                    ctx.beginPath(); ctx.rect(0, 0, 1080, 540); ctx.clip();
                    ctx.drawImage(mainImg, dx, dy, dw, dh);
                    ctx.restore();
                }

                // 3. Text Headlines
                ctx.textAlign = "center";
                const words = titleText.split(' ');
                const mid = Math.ceil(words.length / 2);
                const line1 = words.slice(0, mid).join(' ');
                const line2 = words.slice(mid).join(' ');

                ctx.font = "bold 62px 'Hind Siliguri'";
                ctx.fillStyle = "#A01A1A"; // Red
                ctx.fillText(line1, 540, 665);

                ctx.fillStyle = "#12237A"; // Blue
                ctx.fillText(line2, 540, 755);

                // 4. Logo Area
                ctx.fillStyle = "#006400"; // Green Box
                const boxW = 400; const boxH = 80;
                const boxX = 540 - boxW/2; const boxY = 875;
                ctx.fillRect(boxX, boxY, boxW, boxH);
                
                if(logoImg.complete && logoImg.naturalWidth !== 0) {
                    const logoAspect = logoImg.width / logoImg.height;
                    const h = boxH - 24;
                    const w = h * logoAspect;
                    ctx.drawImage(logoImg, 540 - w/2, boxY + 12, w, h);
                } else {
                    ctx.fillStyle = "white";
                    ctx.font = "bold 40px 'Hind Siliguri'";
                    ctx.fillText("ছাত্র কন্ঠ", 540, boxY + 54);
                }

                // 5. Date
                ctx.fillStyle = "#555";
                ctx.font = "38px 'Hind Siliguri'";
                ctx.fillText(dateText, 540, 1030);
            };

            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => finalizeDrawing(img);
                    img.src = e.target.result;
                };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                finalizeDrawing(null);
            }
        }

        function downloadCard() {
            const canvas = document.getElementById('newsCanvas');
            const dateStr = document.getElementById('date').value.replace(/\s/g, '_');
            const link = document.createElement('a');
            link.download = `ChatroKontho_${dateStr}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        }

        window.onload = () => {
            setTimeout(drawCanvas, 500); // Small delay to ensure fonts/logo load
        };
    </script>
</body>
</html>
